name: Bug
description: Something on the site or in the code doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: device
    attributes:
      label: Browser and device, or Python version
