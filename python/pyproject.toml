[project]
name = "cubecheck"
version = "0.1.0"
description = "Check a 3x3 scramble from one camera view: corner model, sticker reader and the cube rules"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.1",
    "opencv-python-headless>=4.11",
    "torch>=2.5",
]

[project.optional-dependencies]
# Training decodes JPEGs and augments pictures on the GPU (gpu_augment.py).
train = ["torchvision>=0.20"]
# Exporting the models for the browser (scripts/export_onnx.py).
export = ["onnx>=1.17", "onnxruntime>=1.20", "onnxscript>=0.1"]
# Downloading the published models (scripts/download_models.py).
models = ["huggingface_hub>=0.26"]

[dependency-groups]
dev = ["pytest>=8.3", "torchvision>=0.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cubecheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
